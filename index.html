<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1b1c21">
    <title>LCR 게임즈</title>

    <!-- 첫 화면 깜빡임 방지: 저장된 테마(없으면 기기 설정)를 먼저 적용 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('lcr_theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="shortcut icon" href="app-icon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="app-icon.png">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ── 테마 변수 ── */
        :root, html[data-theme="dark"] {
            --bg: #1b1c21;
            --surface: #24262c;
            --surface-2: #2d3037;
            --surface-3: #373a42;
            --card-hover: #292c33;
            --line: rgba(255, 255, 255, 0.08);
            --line-2: rgba(255, 255, 255, 0.17);
            --text: #eeeef1;
            --muted: #b0b3bb;
            --faint: #82858e;
            --amber: #f4b94a;
            --amber-dim: rgba(244, 185, 74, 0.16);
            --amber-ink: #f4b94a;
            --primary-bg: #eeeef1;
            --primary-fg: #1b1c21;
            --star-off: rgba(255, 255, 255, 0.16);
            --toolbar-bg: rgba(27, 28, 33, 0.82);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 28px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 34px rgba(0, 0, 0, 0.3);
            --toast-bg: #f2f2f4;
            --toast-fg: #1b1c21;
            --overlay: rgba(10, 11, 14, 0.7);
            color-scheme: dark;
        }
        html[data-theme="light"] {
            --bg: #f5f3ef;
            --surface: #ffffff;
            --surface-2: #f0eeea;
            --surface-3: #e7e4de;
            --card-hover: #ffffff;
            --line: rgba(30, 28, 24, 0.09);
            --line-2: rgba(30, 28, 24, 0.2);
            --text: #1f2024;
            --muted: #5f626b;
            --faint: #8d9099;
            --amber: #eaa31c;
            --amber-dim: rgba(234, 163, 28, 0.16);
            --amber-ink: #9a6400;
            --primary-bg: #1f2024;
            --primary-fg: #ffffff;
            --star-off: rgba(30, 28, 24, 0.14);
            --toolbar-bg: rgba(245, 243, 239, 0.84);
            --shadow: 0 1px 2px rgba(30, 28, 24, 0.05), 0 10px 30px rgba(30, 28, 24, 0.06);
            --shadow-hover: 0 1px 2px rgba(30, 28, 24, 0.06), 0 16px 40px rgba(30, 28, 24, 0.12);
            --toast-bg: #1f2024;
            --toast-fg: #ffffff;
            --overlay: rgba(30, 28, 24, 0.5);
            color-scheme: light;
        }
        html.theme-anim, html.theme-anim * {
            transition: background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease !important;
        }

        :root { --safe-b: env(safe-area-inset-bottom, 0px); }
        * { box-sizing: border-box; margin: 0; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; background: var(--bg); }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            font-size: 15px;
            line-height: 1.5;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
        }
        body.modal-open { overflow: hidden; }
        .hidden { display: none !important; }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        a { color: inherit; text-decoration: none; }
        .ic { width: 1.15em; height: 1.15em; flex-shrink: 0; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 18px; }
        @media (min-width: 720px) { .wrap { padding: 0 28px; } }

        /* ── 상단 ── */
        .masthead { padding: 30px 0 22px; }
        .masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .brand-mark {
            width: 52px; height: 52px; border-radius: 17px; flex-shrink: 0;
            background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line);
            display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 22px;
        }
        .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 24px; font-weight: 750; letter-spacing: -0.03em; line-height: 1.2; }
        @media (min-width: 720px) { h1 { font-size: 28px; } .brand-mark { width: 58px; height: 58px; border-radius: 19px; } }

        .icon-btn { width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; color: var(--muted); font-size: 20px; transition: background .15s, color .15s; }
        @media (hover: hover) { .icon-btn:hover { background: var(--surface-3); color: var(--text); } }
        .theme-btn { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
        html[data-theme="dark"] .ico-moon, html[data-theme="light"] .ico-sun { display: none; }
        .theme-btn span { display: grid; place-items: center; }

        /* ── 검색 / 필터 ── */
        .toolbar {
            position: sticky; top: 0; z-index: 40;
            background: var(--toolbar-bg);
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        }
        .toolbar .wrap { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; padding-bottom: 12px; }
        .search { position: relative; display: block; }
        .search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 17px; pointer-events: none; }
        .search input {
            width: 100%; height: 46px; padding: 0 18px 0 44px; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--text);
            font: inherit; font-size: 16px; outline: none; transition: border-color .15s;
            -webkit-appearance: none; appearance: none;
        }
        .search input::placeholder { color: var(--faint); }
        .search input:focus { border-color: var(--line-2); }
        .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 0 18px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0; height: 38px; padding: 0 16px; border-radius: 999px;
            background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600;
            transition: background .15s, color .15s;
        }
        .chip.active { background: var(--primary-bg); color: var(--primary-fg); }
        @media (hover: hover) { .chip:not(.active):hover { background: var(--surface-3); color: var(--text); } }
        @media (min-width: 720px) {
            .toolbar .wrap { flex-direction: row-reverse; align-items: center; justify-content: space-between; }
            .search { width: 280px; }
            .chips { margin: 0; padding: 0; overflow: visible; flex-wrap: wrap; }
        }

        main { padding: 14px 0 64px; }

        /* ── 한눈에 보기 ── */
        .overview { margin-bottom: 36px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
        .overview-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; min-height: 56px; text-align: left; }
        .overview-title { font-size: 15px; font-weight: 700; }
        .overview-meta { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .chev { transition: transform .2s; font-size: 18px; }
        .overview.collapsed .chev { transform: rotate(-90deg); }
        .overview.collapsed .overview-body { display: none; }
        .overview-body { display: flex; flex-direction: column; gap: 20px; padding: 6px 20px 20px; }
        .ov-label { margin-bottom: 10px; font-size: 12.5px; font-weight: 600; color: var(--faint); }
        .ov-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 560px) { .ov-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .ov-grid { grid-template-columns: repeat(4, 1fr); } }
        .tile {
            position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 52px; padding: 8px 14px;
            border-radius: 16px; background: var(--surface-2); text-align: left; transition: background .15s;
        }
        @media (hover: hover) { .tile:hover { background: var(--surface-3); } }
        .tile .t-icon { color: var(--muted); font-size: 17px; }
        .tile .t-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile .t-rate { display: flex; align-items: center; gap: 3px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .tile .t-rate .ic { color: var(--amber); fill: var(--amber); font-size: 12px; }
        .tile-rank {
            position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
            background: var(--amber); color: #1a1405; font-size: 11px; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums;
        }

        /* ── 카드 ── */
        .games { display: flex; flex-direction: column; gap: 44px; }
        .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; padding: 0 4px; }
        .sec-head h2 { font-size: 20px; font-weight: 750; letter-spacing: -0.03em; }
        .sec-head .n { font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }
        .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
        @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            position: relative; display: flex; flex-direction: column; padding: 10px; cursor: pointer;
            background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
            transition: background .2s, box-shadow .2s, transform .2s, border-color .2s;
        }
        @media (hover: hover) { .card:hover { background: var(--card-hover); box-shadow: var(--shadow-hover); transform: translateY(-2px); } }
        .card.highlight { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-dim); }
        .preview { position: relative; aspect-ratio: 16 / 10; border-radius: 16px; background: var(--surface-2); overflow: hidden; }
        .preview-ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 30px; }
        .preview iframe { position: absolute; top: 0; left: 0; width: 200%; height: 200%; border: 0; transform: scale(0.5); transform-origin: 0 0; pointer-events: none; }
        .card-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 12px 10px 8px; }
        .has-preview .card-body { padding-top: 16px; }
        .card-head { display: flex; align-items: center; gap: 14px; }
        .card-icon {
            width: 56px; height: 56px; flex-shrink: 0; display: grid; place-items: center; border-radius: 18px;
            background: var(--surface-2); color: var(--muted); font-size: 24px;
        }
        .has-preview .card-icon { display: none; }
        .card-titles { flex: 1; min-width: 0; }
        .card-titles h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.35; }
        .rank { padding: 1px 8px; border-radius: 999px; background: var(--amber-dim); color: var(--amber-ink); font-size: 11px; font-weight: 700; letter-spacing: 0; }
        .desc { margin-top: 1px; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .avg { display: flex; align-items: center; gap: 4px; flex-shrink: 0; align-self: flex-start; padding-top: 4px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .has-preview .avg { padding-top: 3px; }
        .avg .ic { color: var(--amber); fill: var(--amber); font-size: 15px; }
        .avg b { color: var(--text); font-weight: 700; }
        .rating-count { font-size: 12px; color: var(--faint); }
        .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; }
        .rating-slot { flex: 1; min-width: 0; }
        .card-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .round { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; font-size: 18px; transition: transform .1s, background .15s, color .15s; }
        .round:active { transform: scale(0.94); }
        .round-ghost { background: var(--surface-2); color: var(--muted); }
        @media (hover: hover) { .round-ghost:hover { background: var(--surface-3); color: var(--text); } }
        .round-primary { background: var(--primary-bg); color: var(--primary-fg); }
        .round-primary .ic { fill: currentColor; font-size: 16px; margin-left: 2px; }
        .btn-outline { display: inline-flex; align-items: center; justify-content: center; height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 14px; font-weight: 600; }

        /* ── 별점 ── */
        .rating-widget { --star: 30px; display: flex; flex-direction: column; gap: 6px; }
        @media (max-width: 350px) { .rating-widget { --star: 26px; } }
        .rating-widget.compact { flex-direction: row; align-items: center; gap: 14px; }
        .rating-stars {
            display: inline-flex; gap: 5px; width: max-content; border-radius: 8px; cursor: pointer;
            touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .rating-stars:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
        .star-cell { position: relative; flex-shrink: 0; width: var(--star); height: var(--star); }
        .star-base { position: absolute; inset: 0; color: var(--star-off); }
        .star-fg { position: absolute; top: 0; bottom: 0; left: 0; width: 0; overflow: hidden; color: var(--amber); }
        .star-fg > div { width: var(--star); height: var(--star); }
        .rating-meta { display: flex; align-items: center; gap: 6px; min-height: 22px; }
        .rating-label { font-size: 12.5px; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
        .rating-label.live { color: var(--amber-ink); font-weight: 700; font-size: 14px; }
        .rating-label.mine { color: var(--text); font-weight: 700; font-size: 14px; }
        .rating-clear { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: var(--faint); }
        .rating-clear svg { width: 12px; height: 12px; }
        @media (hover: hover) { .rating-clear:hover { background: var(--surface-3); color: var(--text); } }

        /* ── 게임 화면 ── */
        .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--overlay); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        .modal-panel { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); animation: panelIn .22s ease-out; }
        @keyframes panelIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        @media (min-width: 720px) {
            .modal { padding: 28px; }
            .modal-panel { max-width: 1040px; height: min(92vh, 860px); border: 1px solid var(--line-2); border-radius: 26px; }
        }
        .modal-head { display: flex; align-items: center; gap: 4px; padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
        @media (min-width: 720px) { .modal-head { padding-top: 8px; } }
        .modal-head h2 { flex: 1; min-width: 0; padding: 0 6px; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-stage { position: relative; flex: 1; min-height: 0; background: #000; }
        .loader { position: absolute; inset: 0; display: grid; place-items: center; }
        .spinner { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.18); border-top-color: rgba(255, 255, 255, 0.7); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-stage iframe { position: relative; display: block; width: 100%; height: 100%; border: 0; }
        .modal-foot { display: flex; align-items: center; justify-content: center; padding: 12px 16px calc(12px + var(--safe-b)); background: var(--surface); border-top: 1px solid var(--line); }

        /* ── 토스트 (항상 한 줄) ── */
        .toast {
            position: fixed; left: 50%; bottom: calc(22px + var(--safe-b)); z-index: 60;
            display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); height: 42px; padding: 0 18px 0 14px;
            border-radius: 999px; background: var(--toast-bg); color: var(--toast-fg); font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
            opacity: 0; transform: translate(-50%, 10px); pointer-events: none;
            transition: opacity .18s ease, transform .18s ease, bottom .2s ease;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.error { background: #ffd9d4; color: #5a1710; }
        .toast .ico { display: grid; place-items: center; font-size: 16px; }
        .toast span.msg { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        body.modal-open .toast { bottom: calc(88px + var(--safe-b)); }

        .empty { padding: 72px 16px; text-align: center; color: var(--muted); }
        .empty strong { display: block; margin-bottom: 18px; font-size: 16px; font-weight: 600; color: var(--text); }

        footer { padding: 8px 0 calc(32px + var(--safe-b)); text-align: center; font-size: 12.5px; color: var(--faint); }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <header class="masthead">
        <div class="wrap masthead-row">
            <div class="brand">
                <div class="brand-mark">
                    <img id="main-logo-img" src="logo.png" alt="LCR 게임즈 로고" onerror="this.style.display='none'; document.getElementById('fallback-logo').classList.remove('hidden');">
                    <span id="fallback-logo" class="hidden"><i data-lucide="gamepad-2" class="ic"></i></span>
                </div>
                <h1>LCR 게임즈</h1>
            </div>
            <button id="theme-toggle" type="button" class="icon-btn theme-btn" aria-label="테마 전환">
                <span class="ico-sun"><i data-lucide="sun" class="ic"></i></span>
                <span class="ico-moon"><i data-lucide="moon" class="ic"></i></span>
            </button>
        </div>
    </header>

    <!-- 검색 + 카테고리 -->
    <div id="toolbar" class="toolbar">
        <div class="wrap">
            <label class="search">
                <i data-lucide="search" class="ic"></i>
                <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="게임 검색" aria-label="게임 검색">
            </label>
            <div id="chip-row" class="chips" role="tablist" aria-label="카테고리"></div>
        </div>
    </div>

    <main>
        <div class="wrap">

            <section id="overview-section" class="overview collapsed">
                <button id="overview-toggle" type="button" class="overview-head" aria-expanded="false" aria-controls="quick-overview-container">
                    <span class="overview-title">한눈에 보기</span>
                    <span class="overview-meta"><span id="game-count-badge"></span><i data-lucide="chevron-down" class="ic chev"></i></span>
                </button>
                <div id="quick-overview-container" class="overview-body"></div>
            </section>

            <div id="games-container" class="games"></div>

            <div id="empty-state" class="empty hidden">
                <strong>결과가 없어요</strong>
                <button id="reset-filter-btn" type="button" class="btn-outline">초기화</button>
            </div>
        </div>
    </main>

    <footer>© 2026 LCR</footer>

    <!-- 게임 화면 (모바일은 전체 화면) -->
    <div id="game-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-panel">
            <div class="modal-head">
                <button id="close-modal-btn" type="button" class="icon-btn" aria-label="목록으로 돌아가기"><i data-lucide="arrow-left" class="ic"></i></button>
                <h2 id="modal-title">게임</h2>
                <button id="modal-share-btn" type="button" class="icon-btn" aria-label="공유하기"><i data-lucide="share-2" class="ic"></i></button>
                <a id="modal-external-link" href="#" target="_blank" rel="noreferrer" class="icon-btn" aria-label="새 창에서 열기"><i data-lucide="external-link" class="ic"></i></a>
            </div>
            <div class="modal-stage">
                <div class="loader"><div class="spinner" aria-label="불러오는 중"></div></div>
                <iframe id="modal-iframe" src="" title="게임 화면" allow="autoplay; fullscreen"></iframe>
            </div>
            <div class="modal-foot">
                <div id="modal-rating-slot"></div>
            </div>
        </div>
    </div>

    <!-- 토스트 -->

        // 2. Firebase 설정
        const firebaseConfig = {

        function safeStorageGet(key, fallback = null) {

        // 기존 평점 데이터와 호환되도록 ID 규칙은 그대로 유지

                    { title: "가짜 뉴스 판별 퀴즈", desc: "가짜 뉴스 판별 퀴즈", url: "https://cherryb29.github.io/AIQuiz/", icon: "file-question" },
                    { title: "Math Master", desc: "순열과 조합 연산 퀴즈", url: "https://cherryb29.github.io/combinationPractice/", icon: "calculator" },
                    { title: "오비탈 퀴즈", desc: "화학 오비탈 퀴즈", url: "https://cherryb29.github.io/orbital-quiz/", icon: "atom" },

                    { title: "인구 퀴즈", desc: "국가·도시 인구 비교 퀴즈", url: "https://cherryb29.github.io/populationQuiz/", icon: "users" }
                ]

        const gameByKey = {};
        gameData.forEach(section => section.games.forEach(game => {

        const totalGamesCount = gameData.reduce((sum, s) => sum + s.games.length, 0);

        // DOM
        const $ = (id) => document.getElementById(id);
        const quickOverviewContainer = $('quick-overview-container');
        const gamesContainer = $('games-container');
        const gameModal = $('game-modal');
        const modalTitle = $('modal-title');
        const modalExternalLink = $('modal-external-link');
        const modalIframe = $('modal-iframe');
        const modalRatingSlot = $('modal-rating-slot');
        const closeModalBtn = $('close-modal-btn');
        const modalShareBtn = $('modal-share-btn');
        const gameCountBadge = $('game-count-badge');
        const toastEl = $('toast');
        const toastMessage = $('toast-message');
        const searchInput = $('search-input');
        const chipRow = $('chip-row');
        const emptyState = $('empty-state');
        const overviewSection = $('overview-section');
        const overviewToggle = $('overview-toggle');
        const themeToggle = $('theme-toggle');
        let toastTimeout;
        let currentModalGame = null;
        let modalHistoryPushed = false;

        // 마우스가 있는 넓은 화면에서만 실시간 미리보기 (모바일 데이터·배터리 절약)
        const canPreview = window.matchMedia('(hover: hover) and (min-width: 720px)').matches;

        // ---------- 테마 (라이트 / 다크) ----------
        const rootEl = document.documentElement;
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        const THEME_COLORS = { dark: '#1b1c21', light: '#f5f3ef' };

        function currentTheme() { return rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
        function syncThemeUi() {
            const t = currentTheme();
            if (themeMeta) themeMeta.setAttribute('content', THEME_COLORS[t]);
            themeToggle.setAttribute('aria-label', t === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
        }
        function setTheme(next, persist) {
            rootEl.classList.add('theme-anim');
            rootEl.setAttribute('data-theme', next);
            if (persist) safeStorageSet('lcr_theme', next);
            syncThemeUi();
            setTimeout(() => rootEl.classList.remove('theme-anim'), 350);
        }
        themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark', true));
        // 직접 고른 적이 없으면 기기 설정 변화를 따라감
        try {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
                const saved = safeStorageGet('lcr_theme');
                if (saved !== 'light' && saved !== 'dark') setTheme(e.matches ? 'light' : 'dark', false);
            });
        } catch (e) {}
        syncThemeUi();

        // ---------- 공통 유틸 ----------
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            toastEl.classList.toggle('error', isError);
            toastEl.querySelector('.ico-ok').classList.toggle('hidden', isError);
            toastEl.querySelector('.ico-err').classList.toggle('hidden', !isError);
            toastEl.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2200);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
            }
            legacyCopy(text);
            return Promise.resolve();
        }
        function legacyCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try { document.execCommand('copy'); } catch (err) { console.error('링크 복사 실패', err); }
            document.body.removeChild(textarea);
        }

        async function shareGame(game) {
            const url = `${location.origin}${location.pathname}?game=${encodeURIComponent(game.key)}`;
            if (navigator.share) {
                try {
                    await navigator.share({ title: `${game.title} - LCR 게임즈`, text: game.desc, url });
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                }
            }
            await copyToClipboard(url);
            showToast('링크를 복사했어요');
        }

        // ---------- 별점 위젯 ----------
        const STAR_SVG = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
        const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

        function drawStars(root, value) {
            root.querySelectorAll('.star-fg').forEach((fg, i) => {
                const frac = Math.max(0, Math.min(1, value - i));
                fg.style.width = `${frac * 100}%`;
            });
        }

        // 카드와 게임 화면 하단에서 같이 쓰는 별점 위젯
        function buildRatingWidget(gameCardId, compact = false) {
            const root = document.createElement('div');
            root.className = 'rating-widget' + (compact ? ' compact' : '');
            root.dataset.game = gameCardId;

            const cells = [1, 2, 3, 4, 5].map(() => `
                <div class="star-cell">
                    <div class="star-base">${STAR_SVG}</div>
                    <div class="star-fg"><div>${STAR_SVG}</div></div>
                </div>`).join('');

            root.innerHTML = `
                <div class="rating-stars" tabindex="0" role="slider"
                     aria-label="별점 (0.5점 단위, 좌우 방향키로 조절)" aria-valuemin="0.5" aria-valuemax="5" aria-valuestep="0.5">${cells}</div>
                <div class="rating-meta">
                    <span class="rating-label"></span>
                    <button type="button" class="rating-clear hidden" aria-label="평가 삭제">${X_SVG}</button>
                </div>`;

            const panel = root.querySelector('.rating-stars');
            const label = root.querySelector('.rating-label');
            const clearBtn = root.querySelector('.rating-clear');
            let dragging = false;

            // 위치 → 0.5점 단위 (별의 왼쪽 절반 = x.5, 오른쪽 절반 = x.0)
            function ratingFrom(clientX) {
                const rect = panel.getBoundingClientRect();
                const ratio = (clientX - rect.left) / rect.width;
                const rating = Math.ceil(ratio * 5 * 2) / 2;
                return Math.max(0.5, Math.min(5, rating));
            }

            function preview(value) {
                drawStars(root, value);
                label.textContent = value.toFixed(1);
                label.className = 'rating-label live';
            }

            root._redraw = () => {
                const my = state.userRatings[gameCardId] || 0;
                drawStars(root, my);
                if (my > 0) {
                    label.textContent = my.toFixed(1);
                    label.className = 'rating-label mine';
                } else {
                    label.textContent = '탭해서 평가';
                    label.className = 'rating-label';
                }
                clearBtn.classList.toggle('hidden', my <= 0);
                panel.setAttribute('aria-valuenow', String(my));
            };

            panel.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                dragging = true;
                try { panel.setPointerCapture(e.pointerId); } catch (err) {}
                preview(ratingFrom(e.clientX));
            });
            panel.addEventListener('pointermove', (e) => {
                if (dragging || e.pointerType === 'mouse') preview(ratingFrom(e.clientX));
            });
            panel.addEventListener('pointerleave', () => { if (!dragging) root._redraw(); });
            panel.addEventListener('pointerup', (e) => {
                if (!dragging) return;
                e.stopPropagation();
                dragging = false;
                try { panel.releasePointerCapture(e.pointerId); } catch (err) {}
                commitRating(gameCardId, ratingFrom(e.clientX));
            });
            // 세로 스크롤이 시작되면 브라우저가 취소시킴 → 저장하지 않고 원래대로
            panel.addEventListener('pointercancel', () => { dragging = false; root._redraw(); });

            panel.addEventListener('keydown', (e) => {
                const my = state.userRatings[gameCardId] || 0;
                let next = null;
                if (e.key === 'ArrowRight' || e.key === 'ArrowUp') next = Math.min(5, my + 0.5);
                if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') next = Math.max(0.5, my - 0.5);
                if (next !== null) { e.preventDefault(); commitRating(gameCardId, next); }
            });

            clearBtn.addEventListener('click', (e) => { e.stopPropagation(); commitRating(gameCardId, 0); });
            root.addEventListener('click', (e) => e.stopPropagation());

            root._redraw();
            return root;
        }

        // 평점 저장 (newRating 0 = 평가 삭제)
        async function commitRating(gameCardId, newRating) {
            if (!ctx.ready) {
                showToast('데이터를 불러오는 중이에요');
                updateUI();
                return;
            }
            const stats = state.games[gameCardId] || (state.games[gameCardId] = { ratingSum: 0, ratingCount: 0 });
            const oldRating = state.userRatings[gameCardId] || 0;
            if (oldRating === newRating) { updateUI(); return; }

            const snapshot = { rating: oldRating, sum: stats.ratingSum, count: stats.ratingCount };
            const sumDiff = newRating - oldRating;
            const countDiff = (oldRating === 0 ? 1 : 0) - (newRating === 0 ? 1 : 0);

            state.userRatings[gameCardId] = newRating;
            stats.ratingSum += sumDiff;
            stats.ratingCount += countDiff;
            updateUI();

            if (newRating === 0) showToast('평점을 삭제했어요');
            else if (oldRating === 0) showToast(`${newRating.toFixed(1)}점을 남겼어요`);
            else showToast(`${newRating.toFixed(1)}점으로 수정했어요`);

            if (ctx.useFirebase) {
                try {
                    await setDoc(doc(db, "artifacts", appId, "users", ctx.userId, "ratings", gameCardId), { rating: newRating });
                    await updateDoc(doc(db, "artifacts", appId, "public", "data", "games", gameCardId), {
                        ratingSum: increment(sumDiff),
                        ratingCount: increment(countDiff)
                    });
                } catch (err) {
                    console.error("평점 저장 실패", err);
                    state.userRatings[gameCardId] = snapshot.rating;
                    stats.ratingSum = snapshot.sum;
                    stats.ratingCount = snapshot.count;
                    updateUI();
                    showToast('저장에 실패했어요', true);
                    return;
                }
            }

            // 로컬 백업
            if (newRating === 0) safeStorageRemove(`local_rating_${gameCardId}`);
            else safeStorageSet(`local_rating_${gameCardId}`, newRating);
            safeStorageSet(`local_sum_${gameCardId}`, stats.ratingSum);
            safeStorageSet(`local_count_${gameCardId}`, stats.ratingCount);
        }

        // ---------- 게임 화면(모달) ----------
        function openGame(game) {
            currentModalGame = game;
            modalTitle.textContent = game.title;
            modalExternalLink.href = game.url;
            modalIframe.src = game.url;

            modalRatingSlot.innerHTML = '';
            modalRatingSlot.appendChild(buildRatingWidget(game.id, true));

            gameModal.classList.remove('hidden');
            document.body.classList.add('modal-open');

            // 뒤로가기 버튼으로 게임 화면만 닫히도록 히스토리 추가
            try {
                history.pushState({ modal: true }, '', `?game=${encodeURIComponent(game.key)}`);
                modalHistoryPushed = true;
            } catch (e) {
                modalHistoryPushed = false;
            }
        }

        function hideModal() {
            gameModal.classList.add('hidden');
            modalIframe.src = '';
            modalRatingSlot.innerHTML = '';
            document.body.classList.remove('modal-open');
            currentModalGame = null;
        }

        function closeModal() {
            if (gameModal.classList.contains('hidden')) return;
            if (modalHistoryPushed) {
                modalHistoryPushed = false;
                history.back();   // popstate에서 hideModal 호출
            } else {
                hideModal();
            }
        }

        window.addEventListener('popstate', () => {
            modalHistoryPushed = false;
            if (!gameModal.classList.contains('hidden')) hideModal();
        });

        closeModalBtn.addEventListener('click', closeModal);
        modalShareBtn.addEventListener('click', () => { if (currentModalGame) shareGame(currentModalGame); });
        gameModal.addEventListener('click', (e) => { if (e.target === gameModal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        function scrollToGame(gameId) {
            const target = document.getElementById(gameId);
            if (!target) return;
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('highlight');
            setTimeout(() => target.classList.remove('highlight'), 1600);
        }

        // 미리보기 iframe은 화면 근처에 왔을 때만 불러옴
        const previewObserver = ('IntersectionObserver' in window)
            ? new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const frame = entry.target;
                    if (frame.dataset.src) { frame.src = frame.dataset.src; delete frame.dataset.src; }
                    previewObserver.unobserve(frame);
                });
            }, { rootMargin: '300px' })
            : null;

        // ---------- 화면 그리기 ----------
        // 1. 한눈에 보기
        gameData.forEach(section => {
            const group = document.createElement('div');
            group.dataset.section = section.category;
            group.innerHTML = `<p class="ov-label">${section.category}</p>`;

            const grid = document.createElement('div');
            grid.className = 'ov-grid';

            section.games.forEach(game => {
                const tile = document.createElement('button');
                tile.type = 'button';
                tile.className = 'tile';
                tile.dataset.gameItem = '1';
                tile.dataset.cat = section.category;
                tile.dataset.search = `${game.title} ${game.desc} ${section.category}`.toLowerCase();
                tile.innerHTML = `
                    <span class="tile-rank hidden"></span>
                    <i data-lucide="${game.icon}" class="ic t-icon"></i>
                    <span class="t-name">${game.title}</span>
                    <span class="t-rate"><i data-lucide="star" class="ic"></i><span class="mini-rating">-</span></span>`;
                tile.addEventListener('click', () => scrollToGame(game.id));
                grid.appendChild(tile);
            });

            group.appendChild(grid);
            quickOverviewContainer.appendChild(group);
        });

        // 2. 상세 카드
        gameData.forEach(section => {
            const sec = document.createElement('section');
            sec.dataset.section = section.category;
            sec.innerHTML = `
                <div class="sec-head">
                    <h2>${section.category}</h2>
                    <span class="n">${section.games.length}</span>
                </div>`;

            const grid = document.createElement('div');
            grid.className = 'grid';

            section.games.forEach(game => {
                const card = document.createElement('article');
                card.id = game.id;
                card.className = 'card' + (canPreview ? ' has-preview' : '');
                card.dataset.gameItem = '1';
                card.dataset.detail = '1';
                card.dataset.cat = section.category;
                card.dataset.search = `${game.title} ${game.desc} ${section.category}`.toLowerCase();

                card.innerHTML = `
                    ${canPreview ? `
                    <div class="preview">
                        <div class="preview-ph"><i data-lucide="${game.icon}" class="ic"></i></div>
                        <iframe data-src="${game.url}" title="${game.title} 미리보기" tabindex="-1" scrolling="no"></iframe>
                    </div>` : ''}
                    <div class="card-body">
                        <div class="card-head">
                            <div class="card-icon"><i data-lucide="${game.icon}" class="ic"></i></div>
                            <div class="card-titles">
                                <h3><span>${game.title}</span><span class="rank hidden"></span></h3>
                                <p class="desc" title="${game.desc}">${game.desc}</p>
                            </div>
                            <div class="avg" title="전체 평균 평점">
                                <i data-lucide="star" class="ic"></i>
                                <b class="avg-rating">-</b>
                                <span class="rating-count"></span>
                            </div>
                        </div>
                        <div class="card-foot">
                            <div class="rating-slot"></div>
                            <div class="card-actions">
                                <button type="button" class="round round-ghost share-btn" aria-label="${game.title} 공유하기"><i data-lucide="share-2" class="ic"></i></button>
                                <button type="button" class="round round-primary play-btn" aria-label="${game.title} 플레이"><i data-lucide="play" class="ic"></i></button>
                            </div>
                        </div>
                    </div>`;

                card.querySelector('.rating-slot').appendChild(buildRatingWidget(game.id));

                // 카드 어디를 눌러도 게임이 열림 (별점·공유 제외)
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.share-btn') || e.target.closest('.rating-widget')) return;
                    openGame(game);
                });
                card.querySelector('.share-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    shareGame(game);
                });

                const frame = card.querySelector('iframe');
                if (frame) {
                    if (previewObserver) previewObserver.observe(frame);
                    else frame.src = frame.dataset.src;
                }

                grid.appendChild(card);
            });

            sec.appendChild(grid);
            gamesContainer.appendChild(sec);
        });

        // ---------- 검색 / 필터 ----------
        const filter = { q: '', cat: 'all' };

        function buildChips() {
            const items = [{ cat: 'all', label: '전체' }].concat(gameData.map(s => ({ cat: s.category, label: s.category })));
            chipRow.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'chip';
                btn.dataset.chip = item.cat;
                btn.setAttribute('role', 'tab');
                btn.textContent = item.label;
                btn.addEventListener('click', () => { filter.cat = item.cat; applyFilters(); });
                chipRow.appendChild(btn);
            });
        }

        function applyFilters() {
            const q = filter.q.trim().toLowerCase();
            let visibleDetail = 0;

            document.querySelectorAll('[data-game-item]').forEach(el => {
                const match = (filter.cat === 'all' || el.dataset.cat === filter.cat) && (!q || el.dataset.search.includes(q));
                el.classList.toggle('hidden', !match);
                if (match && el.dataset.detail === '1') visibleDetail++;
            });
            document.querySelectorAll('[data-section]').forEach(sec => {
                sec.classList.toggle('hidden', !sec.querySelector('[data-game-item]:not(.hidden)'));
            });
            overviewSection.classList.toggle('hidden', visibleDetail === 0);
            emptyState.classList.toggle('hidden', visibleDetail !== 0);
            gameCountBadge.textContent = (q || filter.cat !== 'all') ? `${visibleDetail}/${totalGamesCount}` : String(totalGamesCount);

            chipRow.querySelectorAll('.chip').forEach(chip => {
                const active = chip.dataset.chip === filter.cat;
                chip.classList.toggle('active', active);
                chip.setAttribute('aria-selected', String(active));
            });
        }

        searchInput.addEventListener('input', () => { filter.q = searchInput.value; applyFilters(); });
        $('reset-filter-btn').addEventListener('click', () => {
            filter.q = ''; filter.cat = 'all'; searchInput.value = ''; applyFilters();
        });
        buildChips();

        // 한눈에 보기: 기본은 접힘, 마지막 선택을 기억
        function setOverviewCollapsed(collapsed) {
            overviewSection.classList.toggle('collapsed', collapsed);
            overviewToggle.setAttribute('aria-expanded', String(!collapsed));
        }
        setOverviewCollapsed(safeStorageGet('lcr_overview_open') !== '1');
        overviewToggle.addEventListener('click', () => {
            const collapse = !overviewSection.classList.contains('collapsed');
            setOverviewCollapsed(collapse);
            safeStorageSet('lcr_overview_open', collapse ? '0' : '1');
        });

        // ---------- 전체 UI 동기화 ----------
        function updateUI() {
            // 평균 평점 TOP 3 (참여 1명 이상)
            const ranked = Object.keys(state.games)
                .map(id => {
                    const s = state.games[id] || { ratingSum: 0, ratingCount: 0 };
                    return { id, count: s.ratingCount, avg: s.ratingCount > 0 ? s.ratingSum / s.ratingCount : 0 };
                })
                .sort((a, b) => b.avg - a.avg || b.count - a.count)
                .slice(0, 3)
                .filter(item => item.count > 0 && item.avg > 0);
            const rankOf = {};
            ranked.forEach((item, i) => { rankOf[item.id] = i + 1; });

            const miniCards = quickOverviewContainer.querySelectorAll('[data-game-item]');
            let idx = 0;

            gameData.forEach(section => {
                section.games.forEach(game => {
                    const stats = state.games[game.id] || { ratingSum: 0, ratingCount: 0 };
                    const hasRating = stats.ratingCount > 0;
                    const avgText = hasRating ? (stats.ratingSum / stats.ratingCount).toFixed(1) : '-';
                    const rank = rankOf[game.id];

                    const card = document.getElementById(game.id);
                    if (card) {
                        card.querySelector('.avg-rating').textContent = avgText;
                        card.querySelector('.rating-count').textContent = hasRating ? `(${stats.ratingCount})` : '';
                        const rankEl = card.querySelector('.rank');
                        rankEl.classList.toggle('hidden', !rank);
                        if (rank) rankEl.textContent = `인기 ${rank}위`;
                    }

                    const mini = miniCards[idx++];
                    if (mini) {
                        mini.querySelector('.mini-rating').textContent = avgText;
                        const miniRank = mini.querySelector('.tile-rank');
                        miniRank.classList.toggle('hidden', !rank);
                        if (rank) { miniRank.textContent = String(rank); miniRank.title = `인기 ${rank}위`; }
                    }
                });
            });

            document.querySelectorAll('.rating-widget').forEach(w => w._redraw && w._redraw());
            if (window.lucide) lucide.createIcons();
        }

        // ---------- 데이터 로딩 ----------
        function loadLocalDataFallback() {
            gameData.forEach(section => {
                section.games.forEach(game => {
                    state.games[game.id] = {
                        ratingSum: parseFloat(safeStorageGet(`local_sum_${game.id}`, "0")),
                        ratingCount: parseInt(safeStorageGet(`local_count_${game.id}`, "0"))
                    };
                    state.userRatings[game.id] = parseFloat(safeStorageGet(`local_rating_${game.id}`, "0"));
                });
            });
            ctx.useFirebase = false;
            ctx.ready = true;
            updateUI();
        }

        async function initFirebaseAndData() {
            try {
                try {
                    const userCredential = await signInAnonymously(auth);
                    ctx.userId = userCredential.user.uid;
                } catch (authError) {
                    console.warn("Firebase 익명 로그인 실패, 오프라인 로컬 저장소를 사용합니다.", authError);
                    loadLocalDataFallback();
                    return;
                }

                const gamesSnapshot = await getDocs(collection(db, "artifacts", appId, "public", "data", "games"));
                gamesSnapshot.forEach(docSnap => { state.games[docSnap.id] = docSnap.data(); });

                // 문서가 없는 게임만 새로 만든다. 이미 있으면 절대 덮어쓰지 않는다.
                for (const section of gameData) {
                    for (const game of section.games) {
                        if (state.games[game.id]) continue;
                        state.games[game.id] = { ratingSum: 0, ratingCount: 0 };
                        try {
                            const ref = doc(db, "artifacts", appId, "public", "data", "games", game.id);
                            const existing = await getDoc(ref);
                            if (existing.exists()) state.games[game.id] = existing.data();
                            else await setDoc(ref, { ratingSum: 0, ratingCount: 0 });
                        } catch (e) { console.error(e); }
                    }
                }

                const ratingsSnapshot = await getDocs(collection(db, "artifacts", appId, "users", ctx.userId, "ratings"));
                ratingsSnapshot.forEach(docSnap => { state.userRatings[docSnap.id] = docSnap.data().rating; });

                ctx.useFirebase = true;
                ctx.ready = true;
                updateUI();
            } catch (err) {
                console.error("Firebase 초기화 실패, 로컬 모드로 전환합니다.", err);
                loadLocalDataFallback();
            }
        }

        // ---------- 시작 ----------
        applyFilters();
        updateUI();
        initFirebaseAndData();

        // 공유 링크(?game=...)로 들어오면 해당 게임을 바로 연다
        (function openFromLink() {
            const key = new URLSearchParams(location.search).get('game');
            const game = key && gameByKey[key];
            if (!game) return;
            try { history.replaceState({}, '', location.pathname); } catch (e) {}
            openGame(game);
        })();
    </script>
</body>
</html>
